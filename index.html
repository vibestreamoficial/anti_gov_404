<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache">
  <title>anti_gov_404</title>
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
  <div id="screen-auth" class="screen active">
    <div class="box">
      <h1>anti_gov_404</h1>
      <p class="sub">Acesso mediante aprovacao</p>
      <div class="tabs">
        <button type="button" class="tab active" data-mode="login">Entrar</button>
        <button type="button" class="tab" data-mode="register">Solicitar</button>
      </div>
      <form id="auth-form">
        <input id="auth-nick" placeholder="Nick" required>
        <input id="auth-password" type="password" placeholder="Senha" required>
        <input id="auth-reason" class="reg-only hidden" placeholder="Motivo (opcional)">
        <p id="auth-error" class="error hidden"></p>
        <button type="submit" class="btn" id="auth-btn">Entrar</button>
      </form>
      <p class="hint">Admin: admin / admin123 · Bot auto-aceita e manda pro chat</p>
    </div>
  </div>
  <div id="screen-pending" class="screen">
    <div class="box">
      <h2>Aguardando aprovacao</h2>
      <p>Nick: <strong id="pending-nick"></strong></p>
      <button class="btn" type="button" onclick="checkMe()">Verificar status</button>
      <button class="btn outline" type="button" onclick="logout()">Sair</button>
    </div>
  </div>
  <div id="screen-banned" class="screen">
    <div class="box">
      <h2>Conta banida</h2>
      <p id="ban-text"></p>
      <button class="btn outline" type="button" onclick="logout()">Sair</button>
    </div>
  </div>
  <div id="screen-chat" class="screen">
    <header>
      <div>
        <strong id="brand-title">anti_gov_404</strong>
        <span id="user-nick"></span>
        <span id="user-role" class="badge"></span>
      </div>
      <div>
        <button type="button" id="btn-admin" class="btn sm hidden" onclick="toggleAdmin()">Admin</button>
        <button type="button" id="btn-owner" class="btn sm hidden" onclick="openOwnerPanel()">Owner</button>
        <button type="button" class="btn sm outline" onclick="logout()">Sair</button>
      </div>
    </header>
    <div id="bot-banner" class="bot-banner hidden"></div>
    <div id="admin-panel" class="admin-panel hidden">
      <h3>Painel administrador</h3>
      <p class="sub" id="my-ip-label">IP: ...</p>
      <div class="admin-grid">
        <div><h4>Pendentes</h4><div id="pending-list"></div></div>
        <div><h4>Aceitos pelo bot</h4><div id="bot-accepted-list"></div></div>
        <div><h4>Membros</h4><div id="members-list"></div></div>
        <div><h4>Flagados</h4><div id="flagged-list"></div></div>
      </div>
      <h4 style="margin-top:12px;color:#ffaa00">IPs / invasoes</h4>
      <div id="ip-logs"></div>
      <h4 style="margin-top:10px">IPs banidos</h4>
      <div id="ip-bans"></div>
    </div>
    <div id="owner-panel" class="admin-panel hidden">
      <h3>Owner</h3>
      <div id="owner-body"></div>
      <button type="button" class="btn sm outline" onclick="document.getElementById('owner-panel').classList.add('hidden')">Fechar</button>
    </div>
    <div id="messages" class="messages"></div>
    <div class="composer">
      <input id="msg-input" placeholder="Mensagem..." maxlength="500">
      <button type="button" class="btn sm" onclick="sendMsg()">Enviar</button>
    </div>
  </div>
  <script src="app.js?v=4"></script>
</body>
</html>
